<!DOCTYPE html>
<html lang="zh-CN" data-bg="wp" data-theme="light" data-transparency="on" data-corner="round">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="我的个人空间 · Fluent Design 桌面化设计">
<title>Cookiesの海棠乡</title>
<link rel="icon" type="image/jpeg" href="/pics/avatar/avatar.jpg">
<script>
/* 提前应用已保存的个性化设置，避免刷新时闪烁 */
(function(){try{
  var s=JSON.parse(localStorage.getItem('mydesk-settings')||'{}');
  var d=document.documentElement;
  if(s.bg)d.dataset.bg=s.bg;
  if(s.theme)d.dataset.theme=s.theme;
  if(s.transparency)d.dataset.transparency=s.transparency;
  if(s.corner)d.dataset.corner=s.corner;
  if(s.accent)d.style.setProperty('--accent',s.accent);
}catch(e){}})();
</script>
<style>
:root{
  --accent:#0078D4;
  --radius:8px;
  /* WinUI 3 官方 Fluent 缓动曲线（Timing and easing 规范）：
   * Fast Out, Slow In   —— 对象进入场景（导航/生成），末尾强摩擦减速
   * Slow Out, Fast In   —— 对象退出场景，加速直至脱离
   * 点对点移动           —— 现有元素在页面内移动 */
  --ease:cubic-bezier(0,0,0,1);           /* Fast Out, Slow In */
  --ease-out:cubic-bezier(0,0,0,1);       /* 进入 */
  --ease-in:cubic-bezier(1,0,1,1);        /* 退出（Slow Out, Fast In） */
  --ease-ptp:cubic-bezier(0.55,0.55,0,1); /* 点对点移动 */
  /* 标准时长：正常 250ms / 快速 167ms / 更快 83ms */
  --dur-normal:250ms;
  --dur-fast:167ms;
  --dur-faster:83ms;
}
html[data-corner="square"]{--radius:2px}

html[data-theme="light"]{
  --text-1:#1b1b1b;
  --text-2:rgba(0,0,0,.62);
  --text-3:rgba(0,0,0,.45);
  --acrylic-bg:rgba(249,249,249,.66);
  --acrylic-strong-bg:rgba(252,252,252,.9);
  /* 面内描边：画在浅色卡片/面板内部，必须用对比色（暗），白色等于没有 */
  --card-border:rgba(0,0,0,.07);
  /* 卡片外轮廓：浮在壁纸上的那一圈，浅色下留白边以脱离暗背景 */
  --card-edge:rgba(255,255,255,.45);
  /* 控制面：按钮 / 键帽 / 输入框（不随卡片材质变化） */
  --control-fill:rgba(255,255,255,.72);
  --control-fill-hover:rgba(255,255,255,.94);
  --control-stroke:rgba(0,0,0,.09);
  --control-stroke-strong:rgba(0,0,0,.18);
  --solid:#f2f2f2;
  --solid-strong:#fafafa;
  --seg-bg:rgba(0,0,0,.055);
  --seg-active:#ffffff;
  --hover-tint:rgba(0,0,0,.045);
  --reveal:rgba(255,255,255,.55);
  --chip-fallback:rgba(0,120,212,.12);
  /* 主题色影响材质：浅色下用白色基底 + 主题色微染 */
  --acrylic-tint:color-mix(in srgb,var(--accent) 9%,rgba(255,255,255,.78));
  --acrylic-strong-tint:color-mix(in srgb,var(--accent) 10%,rgba(255,255,255,.93));
  --tint-text:color-mix(in srgb,var(--accent) 42%,#1b1b1b);
  /* 阅读页 Aero 毛玻璃（固定，不随透明开关变化） */
  --reader-glass:color-mix(in srgb,var(--accent) 6%,rgba(255,255,255,.24));
  --reader-border:rgba(255,255,255,.55);
  /* 玻璃很透时，用一层 opacity 衬底保证文字可读性 */
  --reader-scrim:rgba(255,255,255,.28);
}
html[data-theme="dark"]{
  --text-1:#ffffff;
  --text-2:rgba(255,255,255,.72);
  --text-3:rgba(255,255,255,.48);
  --acrylic-bg:rgba(36,36,36,.62);
  --acrylic-strong-bg:rgba(30,30,30,.88);
  /* 面内描边：深色下用亮色，画在深色面板上才看得见 */
  --card-border:rgba(255,255,255,.10);
  /* 卡片外轮廓 */
  --card-edge:rgba(255,255,255,.13);
  /* 控制面：按钮 / 键帽 / 输入框 */
  --control-fill:rgba(255,255,255,.07);
  --control-fill-hover:rgba(255,255,255,.13);
  --control-stroke:rgba(255,255,255,.10);
  --control-stroke-strong:rgba(255,255,255,.21);
  --solid:#242424;
  --solid-strong:#2b2b2b;
  --seg-bg:rgba(255,255,255,.07);
  --seg-active:#4a4a4a;
  --hover-tint:rgba(255,255,255,.06);
  --reveal:rgba(255,255,255,.14);
  --chip-fallback:rgba(0,120,212,.25);
  /* 主题色影响材质：深色下用深灰基底 + 主题色微染 */
  /* 深色卡片原本只有 ~0.74 不透明度，落在同色系壁纸上会糊成一片；
   * 提到 ~0.84，保留材质感的同时把正文/标签从背景里拉出来 */
  --acrylic-tint:color-mix(in srgb,var(--accent) 12%,rgba(30,30,30,.82));
  --acrylic-strong-tint:color-mix(in srgb,var(--accent) 14%,rgba(28,28,28,.91));
  --tint-text:color-mix(in srgb,var(--accent) 55%,#ffffff);
  /* 阅读页 Aero 毛玻璃（固定，不随透明开关变化） */
  --reader-glass:color-mix(in srgb,var(--accent) 7%,rgba(20,20,20,.3));
  --reader-border:rgba(255,255,255,.14);
  /* 玻璃很透时，用一层 opacity 衬底保证文字可读性 */
  --reader-scrim:rgba(0,0,0,.32);
}
/* 透明效果关闭：卡片必须真正变成实色。
 * 注意 .acrylic / .acrylic-strong 的 background 用的是 *-tint 变量，
 * 只把 *-bg 换成实色是空操作（那是 .mu-offset 专用的），会导致
 * 「关掉透明后卡片仍是半透明、只是丢了模糊」——反而更难读。 */
html[data-transparency="off"]{
  --acrylic-tint:var(--solid);
  --acrylic-strong-tint:var(--solid-strong);
  --acrylic-bg:var(--solid);
  --acrylic-strong-bg:var(--solid-strong);
}
html[data-transparency="off"] .acrylic,
html[data-transparency="off"] .acrylic-strong{
  -webkit-backdrop-filter:none;backdrop-filter:none;
}

/* 深浅色切换时的全局渐变过渡：切换瞬间挂上，600ms 后移除 */
html.theme-fade,html.theme-fade *,html.theme-fade *::before,html.theme-fade *::after{
  transition:background-color .5s var(--ease),background .5s var(--ease),color .5s var(--ease),
    border-color .5s var(--ease),box-shadow .5s var(--ease),fill .5s var(--ease),outline-color .5s var(--ease) !important;
}

*{box-sizing:border-box}
/* 关键修复：hidden 属性必须永远生效，否则隐形层会挡住整页点击 */
[hidden]{display:none !important}
html,body{height:100%}
body{
  margin:0;
  font-family:"MSYaHei Local","Segoe UI Variable Text","Segoe UI",system-ui,"Microsoft YaHei UI","Microsoft YaHei",sans-serif;
  color:var(--text-1);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--accent);color:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
*{scrollbar-width:thin;scrollbar-color:rgba(128,128,128,.5) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(128,128,128,.45);border-radius:6px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 壁纸层 ---------- */
.wp-wrap{position:fixed;inset:0;z-index:0;background:linear-gradient(135deg,#0f2027,#203a43,#2c5364)}
.wp-layer{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .7s ease}
.wp-vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(0,0,0,.18))}

/* ---------- 通用材质 ---------- */
.acrylic{
  background:var(--acrylic-tint);
  -webkit-backdrop-filter:blur(30px) saturate(160%);
  backdrop-filter:blur(30px) saturate(160%);
  border:1px solid var(--card-edge);
  box-shadow:0 2px 10px rgba(0,0,0,.10);
}
.acrylic-strong{
  background:var(--acrylic-strong-tint);
  -webkit-backdrop-filter:blur(40px) saturate(170%);
  backdrop-filter:blur(40px) saturate(170%);
  border:1px solid var(--card-edge);
  box-shadow:0 8px 32px rgba(0,0,0,.22);
}
/* Reveal：Fluent 风格的高光跟随（点对点移动曲线 + 快速时长）。
 * 内层光斑随指针平滑追随手感（用 translate 驱动，走合成层），
 * 悬停时以 Fast Out, Slow In 淡入，移出时以 Slow Out, Fast In 淡出。 */
.reveal{position:relative;overflow:hidden}
.reveal::before{
  content:"";position:absolute;left:-160px;top:-160px;width:320px;height:320px;
  border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,var(--reveal) 0%,transparent 68%);
  opacity:0;
  transform:translate(var(--mx,0px),var(--my,0px));
  transition:opacity var(--dur-normal) var(--ease-out);
  will-change:transform,opacity;
}
.reveal:hover::before{opacity:1;transition:opacity var(--dur-faster) var(--ease-out)}
.reveal:not(:hover)::before{transition:opacity var(--dur-normal) var(--ease-in)}
/* 触屏设备：无 pointer，reveal 光斑无意义，直接禁用（省电省性能） */
@media (hover:none){
  .reveal::before{display:none}
  .post:active,.github:active{transform:scale(.98)}
  .post:active{box-shadow:0 4px 14px rgba(0,0,0,.16)}
}

/* ---------- 桌面布局 ---------- */
.desktop{
  position:relative;z-index:1;
  display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;
  height:100vh;height:100dvh;padding:20px;
}
.side{display:flex;flex-direction:column;gap:14px;min-height:0}

/* ---------- 左下角全站搜索 ---------- */
.side-search{margin-top:auto;position:relative;flex:none}
.search-pill{
  display:flex;align-items:center;gap:12px;width:100%;
  padding:13px 16px;cursor:pointer;font-family:inherit;color:inherit;text-align:left;
  transition:transform var(--dur-fast) var(--ease-out),box-shadow var(--dur-fast) var(--ease-out),background var(--dur-fast) var(--ease-out);
}
.search-pill svg{width:17px;height:17px;color:var(--text-2);flex:none}
.search-pill:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(0,0,0,.2)}
.search-pill:active{transform:scale(.98)}
.sp-label{font-size:14px;color:var(--text-2)}
/* 键帽：原来只有一圈极淡的描边，深色下几乎消失；改成实底 + 上下不同色的描边，
 * 下边线更重以模拟键帽厚度 */
.sp-kbd{
  margin-left:auto;flex:none;
  font-size:10.5px;line-height:1;letter-spacing:.3px;
  color:var(--text-2);
  background:var(--control-fill);
  border:1px solid var(--control-stroke);
  border-bottom-color:var(--control-stroke-strong);
  border-radius:5px;padding:4px 7px;
}
.search-panel{
  position:absolute;left:0;right:0;bottom:58px;z-index:66;
  border-radius:var(--radius);overflow:hidden;
  opacity:0;transform:translateY(10px);
  transition:opacity var(--dur-normal) var(--ease-out),transform var(--dur-normal) var(--ease-out);
}
.search-panel.show{opacity:1;transform:none}
.sp-inputrow{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--card-border)}
.sp-inputrow svg{width:16px;height:16px;color:var(--text-3);flex:none}
.sp-inputrow input{flex:1;min-width:0;border:none;background:none;outline:none;font:inherit;font-size:14px;color:var(--text-1)}
.sp-results{max-height:46vh;overflow:auto;padding:6px}
.sp-hint{padding:18px 12px;text-align:center;color:var(--text-3);font-size:13px;line-height:1.8}
.sp-item{
  display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;
  padding:10px 12px;border:none;background:none;border-radius:6px;
  cursor:pointer;font-family:inherit;color:inherit;
  transition:background var(--dur-faster) var(--ease-out);
}
.sp-item:hover,.sp-item.active{background:var(--hover-tint)}
.sp-title{font-size:13.5px;font-weight:600;color:var(--text-1);line-height:1.5}
.sp-meta{font-size:11.5px;color:var(--text-3)}
.sp-snip{font-size:12px;color:var(--text-2);line-height:1.7;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sp-item mark{background:color-mix(in srgb,var(--accent) 24%,transparent);color:var(--tint-text);border-radius:3px;padding:0 1px}

/* ---------- 迷你音乐播放器（左下角，仅桌面端） ----------
 * 三板块：左侧封面（点击播放/暂停）｜右上歌词（LRC 同步滚动）｜右下控制区 */
/* 侧栏纵向节奏：头像/GitHub 贴顶，播放器吸收全部剩余高度，搜索贴底。
 * 原本播放器是 flex:none，下方会留下约 380px 空洞再把搜索推到最底，
 * 三段割裂；现在留白由播放器吃掉，歌词区跟着变高。 */
.side-music{flex:1 1 auto;min-height:0;padding:12px;display:flex;flex-direction:column}
.mu-main{display:flex;gap:12px;flex:1;min-height:0}
.mu-left{width:104px;flex:none;display:flex;flex-direction:column;justify-content:space-between}
.mu-cover{
  position:relative;width:104px;height:104px;border:none;padding:0;cursor:pointer;
  border-radius:8px;overflow:hidden;background:var(--seg-bg);
  box-shadow:0 4px 14px rgba(0,0,0,.18);
}
.mu-cover img{width:100%;height:100%;object-fit:cover;display:block;transition:transform var(--dur-normal) var(--ease-out)}
.mu-cover:hover img{transform:scale(1.05)}
.mu-cover:active img{transform:scale(.98)}
.mu-glyph{
  position:absolute;inset:0;display:grid;place-items:center;
  background:rgba(0,0,0,.3);opacity:0;transition:opacity var(--dur-fast) var(--ease-out);
}
.mu-glyph svg{width:30px;height:30px;color:#fff;fill:#fff;filter:drop-shadow(0 2px 6px rgba(0,0,0,.45))}
.mu-cover.paused .mu-glyph{opacity:1}
.mu-meta{margin-top:8px;min-width:0}
.mu-title{font-size:12.5px;font-weight:600;color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mu-artist{font-size:11px;color:var(--text-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.mu-right{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.mu-lyrics{
  height:100%;overflow:hidden;position:relative;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 18%,#000 82%,transparent 100%);
  mask-image:linear-gradient(180deg,transparent 0,#000 18%,#000 82%,transparent 100%);
}
.mu-lyr-inner{padding:40px 2px;display:flex;flex-direction:column;gap:5px}
.mu-lyr-line{font-size:11.5px;line-height:1.5;color:var(--text-3);transition:color var(--dur-normal) var(--ease-out)}
.mu-lyr-line.active{color:var(--text-1);font-weight:600}
.mu-lyr-hint{font-size:11.5px;color:var(--text-3);padding:34px 2px;line-height:1.8;text-align:center}
.mu-lyr-static-hint{padding:0 0 4px;font-size:10px;text-align:left;opacity:.85}
/* 歌词时间偏移微调：悬停歌词区浮现，用于修正个别音源与 LRC 的时间差 */
.mu-lyr-wrap{position:relative;flex:1;min-height:0}
.mu-offset{
  position:absolute;top:0;right:0;z-index:2;align-items:center;gap:1px;
  padding:1px;border-radius:var(--radius);display:none;
  background:var(--acrylic-strong-bg);
  -webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);
  border:1px solid var(--card-border);box-shadow:0 2px 8px rgba(0,0,0,.14);
  opacity:0;transform:translateY(-3px);pointer-events:none;
  transition:opacity var(--dur-fast) var(--ease-out),transform var(--dur-fast) var(--ease-out);
}
.mu-lyr-wrap.timed .mu-offset{display:flex}
.mu-lyr-wrap:hover .mu-offset,.mu-offset:focus-within,.mu-lyr-wrap.hover-lock .mu-offset{opacity:1;transform:none;pointer-events:auto}
.mu-offset button{
  width:17px;height:17px;padding:0;border:none;border-radius:4px;background:none;color:var(--text-2);
  font-size:12px;line-height:1;cursor:pointer;display:grid;place-items:center;
  transition:background var(--dur-faster) var(--ease-out),color var(--dur-faster) var(--ease-out);
}
.mu-offset button:hover{background:var(--hover-tint);color:var(--text-1)}
.mu-offset button:active{transform:scale(.9)}
.mu-offval{
  min-width:32px;text-align:center;font-size:10px;color:var(--text-3);
  font-variant-numeric:tabular-nums;cursor:pointer;user-select:none;
  transition:color var(--dur-fast) var(--ease-out);
}
.mu-offval.changed{color:var(--accent);font-weight:600}

.mu-ctrl{margin-top:8px;flex:none}
.mu-progress{display:flex;align-items:center;gap:8px}
.mu-time{font-size:10px;color:var(--text-3);font-variant-numeric:tabular-nums;flex:none;min-width:26px}
.mu-time:last-child{text-align:right}
.mu-seek{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:14px;background:none;cursor:pointer;--fill:0%}
.mu-seek::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--accent) var(--fill),var(--seg-bg) var(--fill))}
.mu-seek::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;margin-top:-4px;border-radius:50%;background:var(--accent);border:none;box-shadow:0 0 0 2px var(--solid-strong);transition:transform var(--dur-faster) var(--ease-out)}
.mu-seek:hover::-webkit-slider-thumb,.mu-seek:active::-webkit-slider-thumb{transform:scale(1.25)}
.mu-seek::-moz-range-track{height:4px;border-radius:2px;background:var(--seg-bg)}
.mu-seek::-moz-range-progress{height:4px;border-radius:2px;background:var(--accent)}
.mu-seek::-moz-range-thumb{width:12px;height:12px;border:none;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--solid-strong)}

.mu-btns{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:4px}
.mu-btn{
  width:30px;height:30px;border:none;border-radius:50%;background:none;color:var(--text-2);
  display:grid;place-items:center;cursor:pointer;padding:0;
  transition:background var(--dur-faster) var(--ease-out),color var(--dur-faster) var(--ease-out),transform var(--dur-faster) var(--ease-out);
}
.mu-btn:hover{background:var(--hover-tint);color:var(--text-1)}
.mu-btn:active{transform:scale(.94)}
.mu-btn svg{width:17px;height:17px;fill:currentColor}
.mu-btn.prev svg{transform:scaleX(-1)}
.mu-play{width:36px;height:36px;background:var(--accent);color:#fff;box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 45%,transparent)}
.mu-play:hover{background:var(--accent);color:#fff;filter:brightness(1.08)}
.mu-play svg{width:18px;height:18px}
.mu-play .ic-play,.mu-play .ic-pause{display:grid;place-items:center}

.card{border-radius:var(--radius)}

/* 个人信息卡 */
.profile{padding:22px 18px;text-align:center;flex:none}
.profile-text{display:flex;flex-direction:column}
.avatar{
  width:78px;height:78px;margin:0 auto 12px;border-radius:50%;overflow:hidden;
  border:2px solid rgba(255,255,255,.65);box-shadow:0 4px 14px rgba(0,0,0,.22);
  transition:transform var(--dur-normal) var(--ease-out);
}
html[data-theme="dark"] .avatar{border-color:rgba(255,255,255,.25)}
.avatar:hover{transform:scale(1.04)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.profile-name{font-size:18px;font-weight:600;color:var(--tint-text)}
.profile-sig{margin-top:6px;font-size:12.5px;color:var(--text-2);line-height:1.6}

/* GitHub 卡片 */
.github{display:flex;align-items:center;gap:12px;padding:14px 16px;text-decoration:none;color:inherit;flex:none;transition:transform var(--dur-fast) var(--ease-out),box-shadow var(--dur-fast) var(--ease-out),background var(--dur-fast) var(--ease-out)}
.github:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(0,0,0,.2)}
.gh-icon{width:28px;height:28px;fill:var(--text-1);flex:none}
.gh-label{font-size:11px;letter-spacing:.4px;color:var(--text-3);text-transform:uppercase}
.gh-user{font-size:14px;font-weight:600;margin-top:2px}
.gh-arrow{margin-left:auto;width:8px;height:8px;border-top:2px solid var(--text-3);border-right:2px solid var(--text-3);transform:rotate(45deg);transition:transform var(--dur-fast) var(--ease-out),border-color var(--dur-fast) var(--ease-out)}
.github:hover .gh-arrow{transform:translateX(3px) rotate(45deg);border-color:var(--accent)}

/* 主区域 */
.main{min-height:0;display:flex;flex-direction:column}

.view{padding:2px 8px 24px 2px}
.view:not([hidden]){display:flex;flex-direction:column;flex:1;min-height:0;overflow:auto;animation:viewIn var(--dur-normal) var(--ease-out)}
@keyframes viewIn{from{opacity:0;transform:translateY(12px)}}

/* ---------- 博客文章流 ---------- */
.post-list{display:flex;flex-direction:column;gap:14px;max-width:800px}
/* 文章卡用更实的材质，与侧栏导航卡拉开层级：
 * 原本两者都是 .card.acrylic，圆角/边框/阴影完全一样，分不出谁是内容谁是导航 */
.post{
  padding:18px 22px;cursor:pointer;
  background:var(--acrylic-strong-tint);
  transition:transform var(--dur-fast) var(--ease-out),box-shadow var(--dur-fast) var(--ease-out),background var(--dur-fast) var(--ease-out);
}
.post:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(0,0,0,.2)}
.post-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{
  padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:500;
  background:var(--chip-fallback);
  background:color-mix(in srgb,var(--accent) 16%,transparent);
  /* 深色主题下 accent 本身偏暗，直接当文字色会糊在卡片里；用混过白的 tint-text */
  color:var(--tint-text);
}
.post-meta time{margin-left:auto;font-size:12px;color:var(--text-3)}
.post-title{margin:10px 0 6px;font-size:17px;font-weight:600;line-height:1.4;transition:color var(--dur-fast) var(--ease-out)}
.post:hover .post-title{color:var(--tint-text)}
.post-excerpt{
  margin:0;font-size:13px;color:var(--text-2);line-height:1.65;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.post-more{margin-top:10px;font-size:12.5px;color:var(--accent);font-weight:500}
.post-loading,.post-empty{
  padding:40px 20px;text-align:center;color:var(--text-3);font-size:14px;line-height:1.9;
}
.post-loading::before{
  content:"";display:block;width:28px;height:28px;margin:0 auto 14px;
  border:3px solid rgba(128,128,128,.25);border-top-color:var(--accent);
  border-radius:50%;animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.post-empty code{background:rgba(128,128,128,.18);padding:1px 6px;border-radius:4px}

/* ---------- 文章阅读页（沉浸式） ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.16);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:70;opacity:0;transition:opacity .25s}
.overlay.show{opacity:1}
.reader-layer{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;pointer-events:none}
.reader-layer.show .reader{transform:translateY(0);opacity:1}
.reader-layer.show .reader-close{opacity:1}
.reader{
  pointer-events:auto;flex:1;min-height:0;
  margin:16px 16px 0;border-radius:var(--radius);
  overflow:hidden;display:flex;flex-direction:column;
  transform:translateY(24px);opacity:0;
  /* 进入：Fast Out, Slow In（末尾强摩擦），退出：Slow Out, Fast In */
  transition:transform var(--dur-normal) var(--ease-out),opacity var(--dur-normal) var(--ease-out);
  box-shadow:0 12px 48px rgba(0,0,0,.3);
  /* Aero 毛玻璃：无论透明开关与否，阅读页背景都强制模糊玻璃 */
  background:var(--reader-glass);
  -webkit-backdrop-filter:blur(60px) saturate(185%);
  backdrop-filter:blur(60px) saturate(185%);
  border:1px solid var(--reader-border);
}
.reader-layer:not(.show) .reader{
  transition:transform var(--dur-normal) var(--ease-in),opacity var(--dur-faster) var(--ease-in);
}
.reader-body{flex:1;min-height:0;overflow-y:auto;padding:0;background:var(--reader-scrim)}
.reader-inner{max-width:760px;margin:0 auto;padding:46px 36px 72px}
.reader-title{
  font-size:30px;font-weight:650;line-height:1.3;margin:0 0 16px;color:var(--text-1);
  letter-spacing:-.3px;
}
.reader-credits{
  display:flex;align-items:center;gap:14px;padding-bottom:20px;margin-bottom:26px;
  border-bottom:1px solid var(--card-border);
}
.reader-avatar{width:44px;height:44px;border-radius:50%;overflow:hidden;border:2px solid rgba(255,255,255,.65);box-shadow:0 2px 8px rgba(0,0,0,.22);flex:none}
html[data-theme="dark"] .reader-avatar{border-color:rgba(255,255,255,.25)}
.reader-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.reader-by{display:flex;flex-direction:column;gap:2px;min-width:0}
.reader-name{font-size:14px;font-weight:600;color:var(--text-1)}
.reader-home{font-size:12px;color:var(--text-3)}
.reader-credits .reader-time{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}
.reader-time .date{font-size:12px;color:var(--text-3)}
.reader-time .chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.reader-content{font-size:15.5px;line-height:1.95;color:var(--text-1)}
.reader-content p{margin:14px 0}
.reader-content h1,.reader-content h2,.reader-content h3{color:var(--text-1);line-height:1.4;margin:28px 0 12px}
.reader-content h2{font-size:20px;font-weight:650}
.reader-content h3{font-size:17px;font-weight:600}
.reader-content ul,.reader-content ol{margin:14px 0;padding-left:26px}
.reader-content li{margin:6px 0}
.reader-content blockquote{
  margin:18px 0;padding:2px 0 2px 18px;
  border-left:3px solid var(--accent);color:var(--text-2);
}
.reader-content a{color:var(--accent);text-decoration:none}
.reader-content a:hover{text-decoration:underline}
.reader-content pre{background:#1e1e1e;color:#e8e8e8;padding:14px 16px;border-radius:8px;font-size:13px;overflow:auto;font-family:Consolas,"Cascadia Code",monospace;margin:16px 0}
.reader-content code{font-family:Consolas,"Cascadia Code",monospace;font-size:.9em;background:rgba(128,128,128,.18);padding:1px 6px;border-radius:4px}
.reader-content pre code{background:none;padding:0}
/* 代码块复制按钮：Fluent 图标，悬停代码块时右上角浮现 */
.reader-content .code-block{position:relative}
.code-copy{
  position:absolute;top:10px;right:10px;z-index:1;
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 10px;border-radius:6px;cursor:pointer;
  border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.09);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  color:#e8e8e8;font-size:12px;font-weight:500;font-family:inherit;
  opacity:0;transform:translateY(-3px);pointer-events:none;
  transition:opacity var(--dur-fast) var(--ease-out),transform var(--dur-fast) var(--ease-out),background var(--dur-fast) var(--ease-out),border-color var(--dur-fast) var(--ease-out);
}
.code-block:hover .code-copy,.code-copy:focus-visible{opacity:1;transform:none;pointer-events:auto}
.code-copy:hover{background:rgba(255,255,255,.17)}
.code-copy:active{transform:scale(.95)}
.code-copy svg{width:14px;height:14px;display:block}
.code-copy.copied{color:#6ccb5f;border-color:rgba(108,203,95,.45)}
/* 触屏设备：无悬停，按钮常驻右上角。
 * 保持代码一行 + 横向滑动（pre 默认 white-space:pre + overflow:auto）；
 * 顶部留出按钮专属空白区，文字从按钮下方开始，横向滑动时不遮挡 */
@media (hover:none){
  .code-copy{opacity:1;transform:none;pointer-events:auto}
  .code-block pre{margin:16px 0;padding-top:52px}
  .code-copy:active{transform:scale(.95)}
}

/* 螺旋测微计式滚动指示：代码块可滚动时，右侧一根细条上有个高亮弧段
 * 随滚动方向上下移动，像测微计旋钮的反光在「转」，无刻度，两端渐暗 */
.code-block{position:relative}
.code-block.has-scroll::before{
  content:"";position:absolute;top:10px;right:2px;bottom:10px;width:4px;
  pointer-events:none;border-radius:3px;
  background:rgba(255,255,255,.14);
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 14%,#000 86%,transparent 100%);
  mask-image:linear-gradient(180deg,transparent 0,#000 14%,#000 86%,transparent 100%);
}
.code-block.has-scroll::after{
  content:"";position:absolute;right:2px;width:4px;height:26px;border-radius:3px;
  pointer-events:none;background:rgba(255,255,255,.55);
  top:calc(10px + var(--code-scroll-pct,0%) * (100% - 20px - 26px));
  transition:top .1s linear;
}
@media (hover:none){
  .code-block.has-scroll::before,.code-block.has-scroll::after{width:3px}
}
.reader-content strong{font-weight:600}
.reader-content img{max-width:100%;border-radius:8px;margin:16px 0}
.reader-close{
  pointer-events:auto;position:absolute;top:28px;right:32px;z-index:1;
  width:36px;height:36px;border-radius:50%;border:none;cursor:pointer;
  display:grid;place-items:center;
  color:var(--text-1);
  background:var(--acrylic-tint);
  -webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);
  border:1px solid var(--card-border);box-shadow:0 4px 14px rgba(0,0,0,.2);
  opacity:0;transition:opacity var(--dur-normal) var(--ease-out),transform var(--dur-fast) var(--ease-out),background var(--dur-fast) var(--ease-out);
}
.reader-close svg{width:18px;height:18px;fill:currentColor;display:block}
.reader-close:hover{background:var(--hover-tint);transform:scale(1.08)}

/* ---------- 404 页面（与阅读页同款 Aero 玻璃） ---------- */
.nf-body{flex:1;min-height:0;overflow:auto;display:flex;gap:24px;padding:52px 56px 44px}
.nf-left{display:flex;flex-direction:column;flex:1;min-width:0}
.nf-code{font-size:110px;font-weight:700;line-height:.95;letter-spacing:-4px;color:var(--tint-text)}
.nf-title{font-size:24px;font-weight:650;margin:22px 0 10px;color:var(--text-1)}
.nf-desc{font-size:14px;line-height:1.85;color:var(--text-2);max-width:360px}
.nf-home{
  margin-top:auto;align-self:flex-start;
  padding:12px 28px;border:none;border-radius:var(--radius);cursor:pointer;
  font-family:inherit;font-size:13.5px;font-weight:600;color:#fff;
  background:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.14);
  transition:transform var(--dur-fast) var(--ease-out),box-shadow var(--dur-fast) var(--ease-out),filter var(--dur-fast) var(--ease-out);
}
.nf-home:hover{transform:translateY(-2px);box-shadow:0 3px 8px rgba(0,0,0,.18);filter:brightness(1.04)}
.nf-home:active{transform:scale(.96)}
.nf-right{display:flex;align-items:flex-end;flex:none}
.nf-right img{
  height:min(60vh,430px);max-width:40vw;object-fit:contain;display:block;
  filter:drop-shadow(0 12px 26px rgba(0,0,0,.28));
}

/* ---------- 图片查看器（/pictures/<path> 路由，与阅读页同款 Aero 玻璃） ---------- */
.pv-stage{
  flex:1;min-height:0;overflow:auto;
  display:flex;align-items:center;justify-content:center;
  padding:72px 28px 20px;background:var(--reader-scrim);
}
.pv-stage img{
  max-width:100%;max-height:100%;width:auto;height:auto;
  border-radius:10px;box-shadow:0 16px 44px rgba(0,0,0,.35);
  /* 棋盘格衬底：透明 PNG 也能看出轮廓 */
  background:conic-gradient(rgba(128,128,128,.16) 0 25%,transparent 0 50%,rgba(128,128,128,.16) 0 75%,transparent 0) 0 0/22px 22px;
}
.pv-stage.loading::before{
  content:"";width:30px;height:30px;flex:none;
  border:3px solid rgba(128,128,128,.25);border-top-color:var(--accent);
  border-radius:50%;animation:spin 1s linear infinite;
}
.pv-err{text-align:center;color:var(--text-2);font-size:14px;line-height:2.1}
.pv-err b{color:var(--text-1);word-break:break-all}
.pv-bar{
  flex:none;display:flex;align-items:center;gap:14px;
  padding:12px 18px;border-top:1px solid var(--reader-border);background:var(--reader-scrim);
}
.pv-name{font-size:13px;font-weight:600;color:var(--text-1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv-dim{font-size:12px;color:var(--text-3);flex:none}
.pv-raw{margin-left:auto;font-size:12.5px;color:var(--accent);text-decoration:none;flex:none}
.pv-raw:hover{text-decoration:underline}

/* ---------- 右下角 Windows 徽标（Win11 任务栏样式） ---------- */
/* 平时：只有徽标，无底板；悬停：浅色底板浮现；按下/打开：底板更实、带描边 */
.start{
  position:fixed;right:18px;bottom:18px;z-index:65;
  width:44px;height:44px;border-radius:7px;
  border:1px solid transparent;background:transparent;
  display:grid;place-items:center;cursor:pointer;
  transition:transform var(--dur-fast) var(--ease-out),background var(--dur-fast) var(--ease-out),border-color var(--dur-fast) var(--ease-out),box-shadow var(--dur-fast) var(--ease-out);
}
.start:hover{
  background:rgba(255,255,255,.55);border-color:rgba(255,255,255,.75);
  box-shadow:0 2px 10px rgba(0,0,0,.12);
}
.start:active{transform:scale(.9)}
.start.open,.start:active{
  background:rgba(246,246,246,.88);border-color:rgba(0,0,0,.08);
  box-shadow:0 2px 8px rgba(0,0,0,.16);
}
html[data-theme="dark"] .start:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.14);box-shadow:none}
html[data-theme="dark"] .start.open,
html[data-theme="dark"] .start:active{background:rgba(255,255,255,.17);border-color:rgba(255,255,255,.22)}
.start svg{width:24px;height:24px;display:block}

/* ---------- 个性化设置面板 ---------- */
.flyout{
  position:fixed;right:16px;bottom:76px;z-index:60;
  width:380px;max-width:calc(100vw - 24px);border-radius:var(--radius);padding:18px;
  opacity:0;transform:translateY(14px) scale(.98);
  transition:opacity var(--dur-normal) var(--ease-out),transform var(--dur-normal) var(--ease-out);
}
.flyout.show{opacity:1;transform:none}
/* 移动端抽屉的关闭按钮（右上角，桌面端隐藏——桌面点外部即可关闭） */
.flyout-close{
  position:absolute;top:12px;right:12px;width:34px;height:34px;
  border-radius:50%;border:1px solid var(--card-border);cursor:pointer;
  background:var(--hover-tint);color:var(--text-1);
  display:none;place-items:center;
  transition:background var(--dur-fast) var(--ease-out),transform var(--dur-fast) var(--ease-out);
}
.flyout-close svg{width:15px;height:15px;fill:currentColor;display:block}
.flyout-close:hover{background:rgba(128,128,128,.28);transform:scale(1.06)}
.flyout-close:active{transform:scale(.94)}
.flyout-head{font-size:15px;font-weight:600;margin-bottom:14px}
.group{margin-bottom:14px}
.group-title{font-size:12.5px;font-weight:600;color:var(--text-2);margin-bottom:8px}
/* 注：原 .row 与 .group.row 已由 .switch-row 取代（整行可点 + 行级 hover） */

/* 壁纸选择：一条横向滚动带（桌面/移动一致），不再多行堆叠挤占空间 */
.bg-picker{
  display:flex;flex-wrap:nowrap;gap:12px;overflow-x:auto;
  padding:8px 14px 14px;margin:0 -2px;border-radius:8px;
  background:var(--seg-bg);
  border:1px solid var(--card-border);
  scrollbar-width:thin;scrollbar-color:rgba(128,128,128,.5) transparent;
  scroll-snap-type:x proximity;
  /* 两端渐隐：提示「左右还有内容」。原来的第三张缩略图是被硬裁掉的，看着像 bug */
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 16px),transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 16px),transparent 100%);
}
.bg-picker::-webkit-scrollbar{height:8px}
.bg-thumb{background:none;border:none;cursor:pointer;padding:0;flex:none;scroll-snap-align:start}
.thumb{
  width:150px;height:84px;border-radius:6px;background-size:cover;background-position:center;
  border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);transition:border-color .2s,box-shadow .2s;
  display:block;
}
.bg-thumb.active .thumb{
  border-color:var(--accent);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.12),0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent);
}

/* 颜色模式：Win11 分段控件（容器 + 滑动指示块）。
 * 原本是两个独立按钮，未选中态只有约 5% 的灰底 + 一圈看不见的描边，
 * 观感接近「禁用」而不是「可选」。改成滑块后，选中位置自带动画。 */
.theme-btns{
  position:relative;display:flex;padding:2px;
  border-radius:var(--radius);
  background:var(--seg-bg);
  border:1px solid var(--card-border);
}
.seg-thumb{
  position:absolute;top:2px;left:2px;bottom:2px;width:calc(50% - 2px);
  border-radius:calc(var(--radius) - 2px);
  background:var(--seg-active);
  box-shadow:0 1px 3px rgba(0,0,0,.16),0 0 0 1px var(--control-stroke);
  transition:transform var(--dur-fast) var(--ease-ptp);
}
.theme-btns[data-active="1"] .seg-thumb{transform:translateX(100%)}
.theme-btns button{
  position:relative;z-index:1;flex:1;
  padding:6px 0;border:none;background:none;
  color:var(--text-2);cursor:pointer;font-size:13px;font-family:inherit;
  border-radius:calc(var(--radius) - 2px);
  transition:color var(--dur-fast) var(--ease-out);
}
.theme-btns button:not(.active):hover{color:var(--text-1)}
.theme-btns button.active{color:var(--text-1);font-weight:600}

.swatches{display:flex;gap:10px;flex-wrap:wrap;padding:4px}
.swatch{
  position:relative;width:28px;height:28px;border-radius:50%;border:none;cursor:pointer;
  padding:0;display:grid;place-items:center;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.14);
  outline:2px solid transparent;outline-offset:2px;
  transition:outline-color var(--dur-faster) var(--ease-out),transform var(--dur-faster) var(--ease-out);
}
.swatch:hover{transform:scale(1.12)}
/* 选中：文字色圆环 + 按色板亮度自动取黑/白勾。
 * 原本固定用白勾，在青/橙/绿这类亮色板上前景对比度不足。 */
.swatch.active{outline-color:var(--text-2)}
.swatch.active::after{content:"✓";color:var(--ink,#fff);font-size:14px;line-height:1}

/* 开关：整行可点（原热区只有 40×20），并带行级 hover 反馈。
 * 关闭态原来是不透明度固定的灰底 + 白点，浅色下几乎看不见底，
 * 现在用控制面填充 + 描边，圆点跟随文字色，深浅主题下都成立。 */
.switch-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:8px 10px;margin:2px -10px 6px;border-radius:6px;cursor:pointer;
  transition:background var(--dur-faster) var(--ease-out);
}
.switch-row:hover{background:var(--hover-tint)}
.switch-row:active{background:var(--control-fill)}
.switch-label{font-size:12.5px;font-weight:600;color:var(--text-2)}
.switch{position:relative;display:inline-block;width:40px;height:20px;flex:none}
.switch input{opacity:0;width:0;height:0}
.slider{
  position:absolute;inset:0;border-radius:99px;cursor:pointer;
  background:var(--control-fill);
  border:1px solid var(--control-stroke-strong);
  transition:background var(--dur-fast) var(--ease-out),border-color var(--dur-fast) var(--ease-out);
}
.slider::before{
  content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;
  background:var(--text-2);
  transition:transform var(--dur-fast) var(--ease-out),background var(--dur-fast) var(--ease-out),box-shadow var(--dur-fast) var(--ease-out);
}
.switch input:checked + .slider{background:var(--accent);border-color:transparent}
.switch input:checked + .slider::before{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transform:translateX(20px)}

.flyout-foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px;padding-top:12px;border-top:1px solid var(--card-border)}
/* 恢复默认：原本只是一行 accent 色文字，和正文没有区别；
 * 改成 Win11 次要按钮，明确「这是一个可点的操作」 */
.link-btn{
  border:1px solid var(--control-stroke);background:var(--control-fill);
  color:var(--text-1);font-size:12.5px;font-family:inherit;
  cursor:pointer;padding:6px 14px;border-radius:var(--radius);
  transition:background var(--dur-faster) var(--ease-out),transform var(--dur-fast) var(--ease-out);
}
.link-btn:hover{background:var(--control-fill-hover)}
.link-btn:active{transform:scale(.97)}

/* ---------- Toast ---------- */
.toast{
  position:fixed;left:50%;bottom:28px;z-index:90;
  transform:translateX(-50%) translateY(8px);
  padding:10px 18px;border-radius:var(--radius);font-size:13px;
  opacity:0;transition:.25s;pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%)}

/* ---------- 响应式 ---------- */
@media (max-width:920px){
  body{overflow:auto}
  .desktop{grid-template-columns:1fr;height:auto;min-height:100vh;padding:14px 14px 90px}
  .side{flex-direction:row;flex-wrap:wrap;align-items:stretch}
  .profile{flex:1 1 100%;display:flex;align-items:center;text-align:left;gap:14px}
  .avatar{width:56px;height:56px;margin:0}
  .profile-name{font-size:16px}
  .github{flex:1 1 auto}
  .side-search{flex:1 1 100%}
  /* 迷你播放器仅桌面端提供，移动端隐藏 */
  .side-music{display:none}
  .sp-kbd{display:none}
  .flyout-close{display:grid}
  /* 底部抽屉：从屏幕底部滑出，全宽、顶部圆角，拇指热区友好 */
  .flyout{
    left:0;right:0;bottom:0;width:100%;
    max-width:100vw;border-radius:16px 16px 0 0;
    padding:20px 20px 24px;
    transform:translateY(100%);
  }
  .flyout.show{transform:none}
  /* 设置入口徽标移到右下角，避免遮挡抽屉内容 */
  .start{right:12px;bottom:12px;width:40px;height:40px}
  /* 抽屉打开时徽标下滑隐藏，关闭时恢复 */
  .start.open{transform:translateY(72px);pointer-events:none}
  .reader{margin:0;border-radius:0}
  .reader-close{top:14px;right:16px}
  .pv-stage{padding:60px 14px 16px}
  .reader-inner{padding:36px 22px 60px}
  .reader-title{font-size:24px}
  /* 低端安卓 GPU 压力大，移动端降低 blur 半径保流畅 */
  .acrylic{-webkit-backdrop-filter:blur(20px) saturate(150%);backdrop-filter:blur(20px) saturate(150%)}
  .acrylic-strong{-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%)}
  .reader{-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%)}
}
</style>

<script>
/* ================= 数据 ================= */
/* 方案 B：文章清单在 articles/index.json，逐篇文件在 articles/<id>.json。
 * 启动时 fetch 清单，逐篇加载正文，再渲染列表。加文章 = 新增一个 json 文件 + 在 index.json 登记一条。 */
var posts = [];

/* ================= 站点根路径 =================
 * 站点可部署在任意子路径（GitHub Pages 的 /repo/）。常规路径（/ 或 /index.html）
 * 同步可得站点根；/articles/、/pictures/ 路径路由只在根部署下启用（由 Netlify
 * _redirects 的 SPA 回退应答，真实存在的文件优先于重写）；其余深层路径（如被
 * 404.html 应答的未知路径）启动后逐级向上探测。
 */
var BASE=(function(){
  var p=location.pathname;
  /* 路径路由命中：直接以站点根为 BASE，免去逐级探测 */
  if(/^\/(articles|pictures)(\/|$)/.test(p))return '/';
  if(/\/index\.html$/i.test(p))return p.slice(0,-10); /* 去掉 index.html（10 字符） */
  if(/\/$/.test(p))return p;
  return null; /* 深层路径，待探测 */
})();
function assetUrl(rel){return BASE+rel;}
function ensureBase(){
  if(BASE)return Promise.resolve(BASE);
  var p;try{p=decodeURIComponent(location.pathname)}catch(e){p=location.pathname}
  var segs=p.split('/').filter(Boolean);
  var seen={},cands=[];
  for(var i=segs.length;i>=1;i--){
    var c='/'+segs.slice(0,i).join('/')+'/';
    if(!seen[c]){seen[c]=1;cands.push(c);}
  }
  if(!seen['/'])cands.push('/');
  /* 逐个候选根尝试拉取文章清单，能返回合法 JSON 的即为站点根 */
  return cands.reduce(function(pr,c){
    return pr.catch(function(){
      return fetch(c+'articles/index.json').then(function(r){
        if(!r.ok)throw 0;
        return r.json();
      }).then(function(j){
        if(!j||!j.posts)throw 0;
        return c;
      });
    });
  },Promise.reject()).then(function(c){BASE=c;return c;})
  .catch(function(){BASE=p.replace(/[^/]*$/,'')||'/';return BASE;});
}
function fixAssets(){
  document.querySelectorAll('[data-asset]').forEach(function(n){
    /* 壁纸缩略图（.bg-thumb .thumb）不在此预加载——7 张大图会拖慢首屏，
     * 等设置面板首次打开时再经 lazyWallpapers() 加载 */
    if(n.classList.contains('thumb'))return;
    /* 隐藏层（404）内的资源也延迟到该层首次打开时加载 */
    if(n.closest('#nfLayer'))return;
    var rel=n.getAttribute('data-asset');
    if(n.tagName==='IMG')n.src=assetUrl(rel);
    else n.style.backgroundImage='url("'+assetUrl(rel)+'")';
  });
}
/* 壁纸缩略图懒加载：设置面板首次打开时才加载全部缩略图（只跑一次） */
var wallpapersLoaded=false;
function lazyWallpapers(){
  if(wallpapersLoaded)return;
  wallpapersLoaded=true;
  document.querySelectorAll('.bg-thumb .thumb').forEach(function(n){
    var rel=n.getAttribute('data-asset');
    if(rel&&!n.style.backgroundImage)n.style.backgroundImage='url("'+assetUrl(rel)+'")';
  });
}
/* 注入本地字体 @font-face（路径走 BASE，保证深层路径下也能正确加载） */
function injectFonts(){
  var css='@font-face{font-family:"MSYaHei Local";src:url("'+assetUrl('fonts/msyh-regular.woff2')+'") format("woff2");font-weight:400 500;font-display:swap;}\n'
    +'@font-face{font-family:"MSYaHei Local";src:url("'+assetUrl('fonts/msyh-bold.woff2')+'") format("woff2");font-weight:600 650 700;font-display:swap;}';
  var st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
}

/* ================= 代码块复制 =================
 * 阅读页渲染后为每个 <pre> 包一层容器并挂 Fluent 复制按钮：
 * 悬停浮现（WinUI 曲线），点击复制正文并显示 Copied!，1.6s 后还原 */
function enhanceCodeBlocks(root){
  root.querySelectorAll('.reader-content pre').forEach(function(pre){
    var parent=pre.parentNode;
    if(parent.classList&&parent.classList.contains('code-block'))return;
    var wrap=document.createElement('div');
    wrap.className='code-block';
    parent.insertBefore(wrap,pre);
    wrap.appendChild(pre);
    var btn=document.createElement('button');
    btn.className='code-copy';btn.type='button';btn.setAttribute('aria-label','复制代码');
    btn.innerHTML='<svg viewBox="0 0 20 20" fill="none" aria-hidden="true">'
      +'<rect x="6.75" y="2.75" width="10.5" height="10.5" rx="2.25" stroke="currentColor" stroke-width="1.5"/>'
      +'<path d="M13.25 13.25v1.8a2.2 2.2 0 0 1-2.2 2.2H4.95a2.2 2.2 0 0 1-2.2-2.2V8.95a2.2 2.2 0 0 1 2.2-2.2h1.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>'
      +'</svg><span class="cc-label">复制</span>';
    wrap.appendChild(btn);
    btn.addEventListener('click',function(){
      var code=pre.querySelector('code')||pre;
      copyText(code.innerText).then(function(){flashCopied(btn)},function(){flashCopied(btn)});
    });

    /* 螺旋测微计滚动指示：仅当代码超高可滚动时显示，高亮弧段随滚动进度上下「转」 */
    function updateScrollIndicator(){
      var max=pre.scrollHeight-pre.clientHeight;
      if(max>2){
        wrap.classList.add('has-scroll');
        /* 把滚动量映射成 0~1 进度，驱动右侧高亮弧段在轨道上移动 */
        wrap.style.setProperty('--code-scroll-pct',(max>0?pre.scrollTop/max:0));
      }else{
        wrap.classList.remove('has-scroll');
      }
    }
    updateScrollIndicator();
    pre.addEventListener('scroll',updateScrollIndicator,{passive:true});
    window.addEventListener('resize',updateScrollIndicator,{passive:true});
  });
}
function copyText(text){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text);
  }
  /* 非安全上下文（http 等）的降级方案 */
  return new Promise(function(res,rej){
    var ta=document.createElement('textarea');
    ta.value=text;ta.style.cssText='position:fixed;top:-999px;opacity:0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy')?res():rej(new Error('copy failed'));}
    catch(e){rej(e);}
    finally{document.body.removeChild(ta);}
  });
}
function flashCopied(btn){
  btn.classList.add('copied');
  btn.querySelector('.cc-label').textContent='Copied!';
  clearTimeout(btn._ccTimer);
  btn._ccTimer=setTimeout(function(){
    btn.classList.remove('copied');
    btn.querySelector('.cc-label').textContent='复制';

}

/* 主题色 swatch 生成。
 * --ink 是按色板 sRGB 相对亮度算出的勾选色：白勾落在青色 (#00B7C3) 这类
 * 亮色板上对比度只有 2.4:1，阈值 0.35 正好把它挑出来改用黑勾。 */
function swatchInk(hex){
  var m=/^#?([0-9a-f]{6})$/i.exec(hex);
  if(!m)return '#fff';
  var v=parseInt(m[1],16),c=[(v>>16)&255,(v>>8)&255,v&255].map(function(x){
    x/=255;return x<=0.03928?x/12.92:Math.pow((x+0.055)/1.055,2.4);
  });
  return (0.2126*c[0]+0.7152*c[1]+0.0722*c[2])>0.35?'#000':'#fff';
}
el('swatches').innerHTML=ACCENTS.map(function(c){
  return '<button class="swatch" data-accent="'+c+'" style="background:'+c+';--ink:'+swatchInk(c)+'" aria-label="主题色 '+c+'"></button>';
}).join('');

/* ================= 迷你音乐播放器（左下角，仅桌面端） =================
 * 三板块：左侧封面（点击播放/暂停）｜右上歌词｜右下控制区。
 * 懒加载策略：音频 preload=metadata（不整首下载），封面仅当前曲目，
 * 歌词首次切到该曲才 fetch 并缓存。 */
var PLAYLIST=[
  /* offset：歌词时间偏移（秒），正值=歌词延后。
   * 两份 LRC 都是整秒时间戳，实测真实人声起音平均晚 0.5s，故补偿 0.5。 */
  {title:'太聪明',artist:'陈绮贞',src:'music/mp3/tai_cong_ming.mp3',cover:'music/covers/tai_cong_ming.webp',lrc:'music/lyrics/tai_cong_ming.lrc',offset:0.5},
  {title:'水星记',artist:'郭顶',src:'music/mp3/shui_xing_ji.mp3',cover:'music/covers/shui_xing_ji.webp',lrc:'music/lyrics/shui_xing_ji.lrc',offset:0.5},
  {title:'Fakegreen',artist:'ueil',src:'music/mp3/fakegreen.mp3',cover:'music/covers/fakegreen.jpeg',lrc:'music/lyrics/fakegreen.txt',offset:0}
];
var muAudio=el('muAudio'),muCover=el('muCover'),muCoverImg=el('muCoverImg'),
    muTitle=el('muTitle'),muArtist=el('muArtist'),muLyrics=el('muLyrics'),
    muSeek=el('muSeek'),muCur=el('muCur'),muDur=el('muDur'),
    muPlay=el('muPlay'),muPrev=el('muPrev'),muNext=el('muNext'),
    muLyrWrap=el('muLyrWrap'),muOffset=el('muOffset'),muOffVal=el('muOffVal');
var muIdx=0,muSeeking=false,muLyricCache={},muActiveLine=-1,muLyrInner=null,muRafId=0;

/* ---------- 歌词时间偏移（秒）：正值表示歌词延后显示 ----------
 * 个别音源与 LRC 存在整体时差，这里按曲目记忆用户微调结果。 */
var MU_OFF_KEY='mydesk-music-offset';
var muOffMap=(function(){try{return JSON.parse(localStorage.getItem(MU_OFF_KEY))||{}}catch(e){return{}}})();
var muOffHideT=0;
function muOffsetOf(i){
  var v=muOffMap[i];
  return typeof v==='number'&&isFinite(v)?v:(PLAYLIST[i].offset||0);
}
function muOffsetPaint(v){
  muOffVal.textContent=(v>0?'+':'')+v.toFixed(1)+'s';
  muOffVal.classList.toggle('changed',Math.abs(v)>0.001);
}
function muOffsetSet(i,v){
  v=Math.round(v*20)/20;
  if(v>30)v=30;if(v<-30)v=-30;
  if(Math.abs(v)<0.001)delete muOffMap[i];else muOffMap[i]=v;
  try{localStorage.setItem(MU_OFF_KEY,JSON.stringify(muOffMap))}catch(e){}
  muOffsetPaint(v);
  muActiveLine=-2; /* 强制重算高亮行 */
  muSyncLyrics();
  /* 微调后短暂锁住浮层，方便连续点击 */
  if(muLyrWrap){muLyrWrap.classList.add('hover-lock');clearTimeout(muOffHideT);
    muOffHideT=setTimeout(function(){muLyrWrap.classList.remove('hover-lock')},1600);}
}
function muOffsetRender(){muOffsetPaint(muOffsetOf(muIdx))}
if(muOffset){
  el('muOffMinus').addEventListener('click',function(){muOffsetSet(muIdx,muOffsetOf(muIdx)-0.5)});
  el('muOffPlus').addEventListener('click',function(){muOffsetSet(muIdx,muOffsetOf(muIdx)+0.5)});
  muOffVal.addEventListener('click',function(){muOffsetSet(muIdx,0)});
}

function muFmt(s){
  if(!isFinite(s))return'0:00';
  s=Math.max(0,Math.floor(s));
  return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2);
}
/* 进度条的 value 是 0–1000 的千分比（max="1000"），
 * 换算成秒必须 value/1000*duration；写 value/10*duration 会放大 100 倍、
 * 被浏览器截断到曲尾，表现为「拖一点点就跳到最后」。 */
function muSeekSeconds(v){
  return (isFinite(muAudio.duration)&&muAudio.duration>0)?(v/1000)*muAudio.duration:0;
}
function parseLRC(text){
  var out=[],rows=text.split(/\r?\n/),re=/\[(\d{1,2}):(\d{1,2}(?:\.\d{1,3})?)\]/g,m;
  rows.forEach(function(row){
    re.lastIndex=0;var times=[];
    while((m=re.exec(row)))times.push(parseInt(m[1],10)*60+parseFloat(m[2]));
    var txt=row.replace(/\[[^\]]*\]/g,'').trim();
    if(!txt)return;
    times.forEach(function(t){out.push({t:t,text:txt})});
  });
  out.sort(function(a,b){return a.t-b.t});
  return out;
}
function muLoadLyrics(i){
  if(muLyricCache[i]!==undefined)return Promise.resolve(muLyricCache[i]);
  return fetch(assetUrl(PLAYLIST[i].lrc)).then(function(r){return r.text()}).then(function(text){
    var timed=/\[\d{1,2}:\d{1,2}/.test(text);
    muLyricCache[i]=timed?{timed:true,lines:parseLRC(text)}:{timed:false,lines:text.split(/\r?\n/).filter(function(l){return l.trim()})};
    return muLyricCache[i];
  }).catch(function(){muLyricCache[i]={timed:false,lines:[]};return muLyricCache[i]});
}
function muRenderLyrics(data){
  muActiveLine=-1;muLyrInner=null;
  if(muLyrWrap)muLyrWrap.classList.toggle('timed',!!(data&&data.timed));
  if(!data||!data.lines.length){muLyrics.innerHTML='<div class="mu-lyr-hint">暂无歌词</div>';return;}
  var html='';
  if(!data.timed)html+='<div class="mu-lyr-hint mu-lyr-static-hint">纯文本歌词 · 无时间同步</div>';
  html+=data.lines.map(function(l){
    return '<div class="mu-lyr-line">'+escHtml(data.timed?l.text:l)+'</div>';
  }).join('');
  muLyrics.innerHTML='<div class="mu-lyr-inner">'+html+'</div>';
  muLyrInner=muLyrics.querySelector('.mu-lyr-inner');
  muLyrics.scrollTop=0;
  muOffsetRender();
  muSyncLyrics();
}
/* 同步高亮：取「最后一句已经开始」的歌词行。
 * 注意偏移量 —— 正值表示歌词应延后，故查询时间要往前回溯 offset 秒。 */
function muSyncLyrics(){
  var data=muLyricCache[muIdx];
  if(!data||!data.timed||!muLyrInner)return;
  var t=muAudio.currentTime-muOffsetOf(muIdx),n=data.lines.length,i=n-1;
  while(i>=0&&data.lines[i].t>t)i--;
  if(i>=n)i=n-1;
  if(i===muActiveLine)return;
  if(muLyrInner.children[muActiveLine])muLyrInner.children[muActiveLine].classList.remove('active');
  muActiveLine=i;
  var line=muLyrInner.children[i];
  if(!line)return;
  line.classList.add('active');
  muLyrics.scrollTo({top:line.offsetTop-(muLyrics.clientHeight-line.offsetHeight)/2,behavior:'smooth'});
}
/* 播放期间用 rAF 逐帧同步：timeupdate 只有 ~4Hz，最多会慢 250ms，逐帧更跟手 */
function muSyncTick(){
  if(muAudio.paused||muAudio.seeking){muRafId=0;return}
  muRafId=requestAnimationFrame(muSyncTick);
  muSyncLyrics();
}
function muSyncStart(){muSyncLyrics();if(!muRafId)muRafId=requestAnimationFrame(muSyncTick)}
function muSetPlayIcon(playing){
  muCover.classList.toggle('paused',!playing);
  muPlay.querySelector('.ic-play').hidden=playing;
  muPlay.querySelector('.ic-pause').hidden=!playing;
  muPlay.setAttribute('aria-label',playing?'暂停':'播放');
}
function muLoadTrack(i,keepPlaying){
  muIdx=(i+PLAYLIST.length)%PLAYLIST.length;
  var reqIdx=muIdx,t=PLAYLIST[muIdx];
  muAudio.src=assetUrl(t.src);
  muCoverImg.src=assetUrl(t.cover);
  muTitle.textContent=t.title;muTitle.title=t.title+' - '+t.artist;
  muArtist.textContent=t.artist;muArtist.title=t.title+' - '+t.artist;
  muSeek.value=0;muSeek.style.setProperty('--fill','0%');
  muCur.textContent='0:00';muDur.textContent='0:00';
  muLyrics.innerHTML='<div class="mu-lyr-hint">歌词加载中…</div>';
  muLyrInner=null;muActiveLine=-1;
  if(muLyrWrap)muLyrWrap.classList.remove('timed','hover-lock');
  muLoadLyrics(muIdx).then(function(data){if(muIdx===reqIdx)muRenderLyrics(data)});
  /* 系统级媒体控制（Win11 媒体浮层可显示封面/标题并遥控） */
  if('mediaSession' in navigator){
    try{
      navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist,album:'Cookiesの海棠乡',artwork:[{src:assetUrl(t.cover),sizes:'256x256'}]});
      navigator.mediaSession.setActionHandler('play',function(){muAudio.play()});
      navigator.mediaSession.setActionHandler('pause',function(){muAudio.pause()});
      navigator.mediaSession.setActionHandler('previoustrack',function(){muLoadTrack(muIdx-1,true)});
      navigator.mediaSession.setActionHandler('nexttrack',function(){muLoadTrack(muIdx+1,true)});
    }catch(e){}
  }
  if(keepPlaying)muAudio.play().catch(function(){});
}
function muToggle(){
  if(muAudio.paused){if(!muAudio.src)muAudio.src=assetUrl(PLAYLIST[muIdx].src);muAudio.play().catch(function(){muToastFail()})}
  else muAudio.pause();
}
function muToastFail(){toast('歌曲加载失败，请稍后再试')}
muCover.addEventListener('click',muToggle);
muPlay.addEventListener('click',muToggle);
muPrev.addEventListener('click',function(){muLoadTrack(muIdx-1,!muAudio.paused)});
muNext.addEventListener('click',function(){muLoadTrack(muIdx+1,!muAudio.paused)});
muAudio.addEventListener('play',function(){muSetPlayIcon(true);muSyncStart()});
muAudio.addEventListener('pause',function(){muSetPlayIcon(false)});
muAudio.addEventListener('timeupdate',function(){
  if(!muSeeking&&isFinite(muAudio.duration)&&muAudio.duration>0){
    var pct=muAudio.currentTime/muAudio.duration*100;
    muSeek.value=Math.round(pct*10);
    muSeek.style.setProperty('--fill',pct+'%');
    muCur.textContent=muFmt(muAudio.currentTime);
  }
  if(muAudio.paused)muSyncLyrics();
});
muAudio.addEventListener('loadedmetadata',function(){muDur.textContent=muFmt(muAudio.duration)});
muAudio.addEventListener('ended',function(){muLoadTrack(muIdx+1,true)});
muAudio.addEventListener('error',function(){if(muAudio.src)muToastFail()});
muSeek.addEventListener('input',function(){
  muSeeking=true;
  muSeek.style.setProperty('--fill',(this.value/10)+'%');
  muCur.textContent=muFmt(muSeekSeconds(this.value));
});
muSeek.addEventListener('change',function(){
  muSeeking=false;
  if(isFinite(muAudio.duration)&&muAudio.duration>0)muAudio.currentTime=muSeekSeconds(this.value);
  muActiveLine=-2; /* 拖动后强制重算，避免高亮停留在旧行 */
  muSyncLyrics();
});
/* 键盘拖动 / 在窗口外松开鼠标等情况下 change 可能不来，兜底解锁，
 * 避免 muSeeking 卡在 true 让进度条再也不刷新。延到下一轮事件循环再解锁，
 * 保证同一次 mouseup 里同步派发的 change 已经先读到正确的 value。 */
window.addEventListener('pointerup',function(){setTimeout(function(){muSeeking=false},0)});
window.addEventListener('blur',function(){muSeeking=false});
/* 初始装载第一首（音频仅 metadata，封面+歌词轻量加载） */
muLoadTrack(0,false);

/* ================= 全站搜索（左下角） ================= */
var searchPanel=el('searchPanel'),searchInput=el('searchInput'),
    searchResults=el('searchResults'),searchPill=el('searchPill');
var searchIndex=null,searchTimer=null;
function escHtml(s){return String(s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
/* 关键词高亮：先转义再包裹 <mark>，避免注入 */
function hi(text,q){
  var out='',low=String(text).toLowerCase(),ql=q.toLowerCase(),i=0,idx;
  while((idx=low.indexOf(ql,i))>-1){
    out+=escHtml(text.slice(i,idx))+'<mark>'+escHtml(text.substr(idx,q.length))+'</mark>';
    i=idx+q.length;
    if(out.length>500)break;
  }
  return out+escHtml(text.slice(i));
}
function searchIndexReady(){
  if(searchIndex)return Promise.resolve(searchIndex);
  if(!postsReady)return Promise.resolve(null);
  return postsReady.then(function(){
    searchIndex=posts.map(function(p){
      var d=document.createElement('div');d.innerHTML=p.content||'';
      return{id:p.id,title:p.title||'',date:p.date||'',tags:p.tags||[],excerpt:p.excerpt||'',
        text:(d.textContent||'').replace(/\s+/g,' ').trim()};
    });
    return searchIndex;
  });
}
function runSearch(){
  var q=searchInput.value.trim();
  if(!q){searchResults.innerHTML='<div class="sp-hint">输入关键词搜索全站文章，回车打开第一篇结果</div>';return;}
  searchIndexReady().then(function(idx){
    /* 面板已关或关键词已变时丢弃过期结果 */
    if(searchPanel.hidden||searchInput.value.trim()!==q)return;
    if(!idx){searchResults.innerHTML='<div class="sp-hint">文章还在加载…</div>';return;}
    var ql=q.toLowerCase(),res=[];
    idx.forEach(function(p){
      var s=0,snip='';
      if(p.title.toLowerCase().indexOf(ql)>-1)s+=5;
      p.tags.forEach(function(t){if(String(t).toLowerCase().indexOf(ql)>-1)s+=3;});
      if(p.excerpt.toLowerCase().indexOf(ql)>-1)s+=2;
      var at=p.text.toLowerCase().indexOf(ql);
      if(at>-1){s+=1;snip=p.text.substr(Math.max(0,at-30),90);}
      if(s)res.push({p:p,s:s,snip:snip});
    });
    res.sort(function(a,b){return b.s-a.s});
    if(!res.length){searchResults.innerHTML='<div class="sp-hint">没有找到与「'+escHtml(q)+'」相关的内容</div>';return;}
    searchResults.innerHTML=res.slice(0,8).map(function(r){
      return '<button class="sp-item" data-id="'+escHtml(r.p.id)+'">'
        +'<span class="sp-title">'+hi(r.p.title,q)+'</span>'
        +'<span class="sp-meta">'+escHtml(r.p.date)+' · '+r.p.tags.map(escHtml).join(' / ')+'</span>'
        +(r.snip?'<span class="sp-snip">'+hi(r.snip,q)+'</span>':'')
        +'</button>';
    }).join('');
  });
}
function openSearch(){
  searchPanel.hidden=false;
  requestAnimationFrame(function(){searchPanel.classList.add('show')});
  searchPill.classList.add('open');searchPill.setAttribute('aria-expanded','true');
  searchInput.focus();
  runSearch();
}
function closeSearch(){
  searchPanel.classList.remove('show');
  searchPill.classList.remove('open');searchPill.setAttribute('aria-expanded','false');
  /* 立即隐藏并把焦点移出输入框，避免 type=search 的焦点残留触发默认行为或二次路由 */
  searchPanel.hidden=true;
  searchInput.blur();
}
searchPill.addEventListener('click',function(){searchPanel.hidden?openSearch():closeSearch()});
searchInput.addEventListener('input',function(){clearTimeout(searchTimer);searchTimer=setTimeout(runSearch,140)});
searchResults.addEventListener('click',function(e){
  var it=e.target.closest('.sp-item');if(!it)return;
  closeSearch();nav('articles/'+encodeURIComponent(it.dataset.id));
});
searchInput.addEventListener('keydown',function(e){
  var items=searchResults.querySelectorAll('.sp-item');
  var cur=searchResults.querySelector('.sp-item.active');
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();
    if(!items.length)return;
    var i=Array.prototype.indexOf.call(items,cur);
    i=e.key==='ArrowDown'?(i+1)%items.length:(i-1+items.length)%items.length;
    if(cur)cur.classList.remove('active');
    items[i].classList.add('active');
    items[i].scrollIntoView({block:'nearest'});
  }else if(e.key==='Enter'){
    /* 阻止 type=search 的默认行为，并阻断冒泡，避免二次路由导致「闪入后退出」 */
    e.preventDefault();e.stopPropagation();
    var tgt=cur||items[0];
    if(tgt){closeSearch();nav('articles/'+encodeURIComponent(tgt.dataset.id));}
  }
});
document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&String(e.key).toLowerCase()==='k'){
    e.preventDefault();
    searchPanel.hidden?openSearch():closeSearch();
  }
});
document.addEventListener('pointerdown',function(e){
  if(!searchPanel.hidden&&!searchPanel.contains(e.target)&&!searchPill.contains(e.target))closeSearch();
});

/* ================= 404 页面 ================= */
function open404(){
  /* 独占显示：先瞬时关掉阅读层与图片查看器 */
  readerLayer.hidden=true;readerLayer.classList.remove('show');
  pvLayer.hidden=true;pvLayer.classList.remove('show');
  if(!nfLayer.hidden)return;
  /* 首次打开 404 时才加载角色图（懒加载，避免首屏多拉一张图） */
  nfLayer.querySelectorAll('[data-asset]').forEach(function(n){
    var rel=n.getAttribute('data-asset');
    if(rel){if(n.tagName==='IMG')n.src=assetUrl(rel);else n.style.backgroundImage='url("'+assetUrl(rel)+'")';}
    n.removeAttribute('data-asset');
  });
  nfLayer.hidden=false;overlay.hidden=false;
  requestAnimationFrame(function(){requestAnimationFrame(function(){
    nfLayer.classList.add('show');overlay.classList.add('show');
  })});
}
function close404(){
  if(nfLayer.hidden)return;
  nfLayer.classList.remove('show');
  setTimeout(function(){
    nfLayer.hidden=true;overlay.hidden=readerLayer.hidden&&pvLayer.hidden;
  },280);
}
el('nfClose').addEventListener('click',goHome);
el('nfHome').addEventListener('click',goHome);

/* ================= 图片查看器（/pictures/<path>） =================
 * 路径 /pictures/<path> 由 Netlify _redirects 回退到本页，这里解析路径并
 * 加载 pics/<path> 的图片（无扩展名时自动尝试常见后缀）。 */
var pvLayer=el('pvLayer'),pvStage=el('pvStage'),pvImg=el('pvImg'),pvErr=el('pvErr'),pvErrPath=el('pvErrPath'),
    pvName=el('pvName'),pvDim=el('pvDim'),pvRaw=el('pvRaw');
var PV_EXTS=['','.jpg','.jpeg','.png','.webp','.gif','.avif'];
var pvTries=0,pvPath='';
function openPicture(path){
  /* 独占显示：先瞬时关掉阅读层与 404 层 */
  readerLayer.hidden=true;readerLayer.classList.remove('show');
  nfLayer.hidden=true;nfLayer.classList.remove('show');
  pvPath=path;pvTries=0;
  pvName.textContent=decodeURIComponent(path.split('/').pop()||path);
  pvErr.hidden=true;pvErrPath.textContent='';
  pvImg.style.display='none';pvImg.removeAttribute('src');
  pvDim.textContent='';
  pvStage.classList.add('loading');
  pvLayer.hidden=false;overlay.hidden=false;
  requestAnimationFrame(function(){requestAnimationFrame(function(){
    pvLayer.classList.add('show');overlay.classList.add('show');
  })});
  el('pvClose').focus();
  tryLoadPicture();
}
function tryLoadPicture(){
  if(pvLayer.hidden)return;
  if(pvTries>=PV_EXTS.length){
    pvStage.classList.remove('loading');
    pvErrPath.textContent='/pictures/'+pvPath;
    pvErr.hidden=false;
    return;
  }
  var src=assetUrl('pics/'+pvPath+PV_EXTS[pvTries++]);
  pvRaw.href=src;
  pvImg.onload=pictureOk;
  pvImg.onerror=tryLoadPicture;
  pvImg.src=src;
}
function pictureOk(){
  if(pvLayer.hidden)return;
  pvStage.classList.remove('loading');
  pvImg.style.display='';
  pvDim.textContent=pvImg.naturalWidth+' × '+pvImg.naturalHeight+' px';
}
function closePicture(){
  if(pvLayer.hidden)return;
  pvLayer.classList.remove('show');
  setTimeout(function(){
    pvLayer.hidden=true;overlay.hidden=readerLayer.hidden&&nfLayer.hidden;
    pvImg.removeAttribute('src');pvImg.onerror=null;
    pvStage.classList.remove('loading');pvErr.hidden=true;
  },280);
}
el('pvClose').addEventListener('click',goHome);

/* ================= 路由 =================
 * 路径级路由（配合 Netlify _redirects 的 SPA 回退，真实文件优先于重写）：
 *   /                    首页
 *   /articles/<id>       文章阅读页
 *   /pictures/<path>     图片查看器（查看 pics/<path> 的图片）
 *   其他任何路径          404 页面
 * 兼容旧版哈希路由：#/post/<id> 原地升级为 /articles/<id>。
 */
function pathAfterBase(){
  var p;
  try{p=decodeURIComponent(location.pathname)}catch(e){p=location.pathname}
  if(BASE&&p.indexOf(BASE)===0)p=p.slice(BASE.length);
  p=p.replace(/index\.html$/i,'');
  return p.replace(/^\/+|\/+$/g,'');
}
function nav(path){
  history.pushState(null,'',assetUrl(path));
  handleRoute();
}
function goHome(){nav('');}
function routePost(id){
  postsReady.then(function(){
    /* 等待期间路由可能又变了，校验一次 */
    var cur=pathAfterBase().match(/^articles\/(.+)$/);
    if(!cur||cur[1]!==id)return;
    var p=null;
    for(var i=0;i<posts.length;i++){if(posts[i].id===id){p=posts[i];break;}}
    if(p){close404();closePicture();openArticle(p);}
    else{closeArticle();closePicture();open404();}
  });
}
function handleRoute(){
  var seg=pathAfterBase();
  /* 旧哈希 #/post/<id> 原地升级为路径路由 */
  var legacy=(location.hash||'').match(/^#\/post\/(.+)$/);
  if(legacy&&!seg){
    var lid='';
    try{lid=decodeURIComponent(legacy[1])}catch(e){lid=legacy[1]}
    history.replaceState(null,'',assetUrl('articles/'+lid));
    seg='articles/'+lid;
  }
  var m;
  if((m=seg.match(/^articles\/(.+)$/))&&m[1]){routePost(m[1]);return;}
  if((m=seg.match(/^pictures\/(.+)$/))&&m[1]){closeArticle();close404();openPicture(m[1]);return;}
  if(seg===''){
    var h=location.hash||'';
    /* 根路径上的杂散哈希（非 #/ 与 #/post/）视为 404，与旧版行为一致 */
    if(h&&h!=='#/'&&h!=='#'){closeArticle();closePicture();open404();return;}
    closeArticle();close404();closePicture();return;
  }
  closeArticle();closePicture();open404();
}

/* ================= 事件委托 ================= */
document.addEventListener('click',function(e){
  var post=e.target.closest('.post');
  if(post)nav('articles/'+encodeURIComponent(post.dataset.id));
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    if(!readerLayer.hidden)goHome();
    else if(!nfLayer.hidden)goHome();
    else if(!pvLayer.hidden)goHome();
    else if(!searchPanel.hidden)closeSearch();
    else if(!flyout.hidden)closeFlyout();
  }
});

/* Reveal 高亮跟随鼠标：光斑（320px，中心在 160px 处）随指针平滑对准 */
document.addEventListener('pointermove',function(e){
  var t=e.target;
  var elx=t&&t.closest?t.closest('.reveal'):null;
  if(!elx)return;
  var r=elx.getBoundingClientRect();
  /* translate 位移 = 指针位置 - 光斑中心半径，让光斑中心正对光标 */
  elx.style.setProperty('--mx',(e.clientX-r.left-160)+'px');
  elx.style.setProperty('--my',(e.clientY-r.top-160)+'px');
});
document.addEventListener('pointerleave',function(e){
  var t=e.target;
  var elx=t&&t.closest?t.closest('.reveal'):null;
  if(elx)elx.style.setProperty('--mx','0px'),elx.style.setProperty('--my','0px');
},true);

/* ================= 初始化 ================= */
/* 先占位加载态，探测到站点根后：修正资源路径、应用设置、加载文章、路由 */
el('postList').innerHTML='<div class="post-loading">正在加载…</div>';
var postsReady=null;
ensureBase().then(function(){
  fixAssets();
  injectFonts();
  applySettings(true);
  postsReady=loadPosts();
  handleRoute();
  window.addEventListener('popstate',handleRoute);
  window.addEventListener('hashchange',handleRoute);
});

/* ================= 文章加载（方案 B：fetch 清单 + 逐篇正文） ================= */
function loadPosts(){
  var list=el('postList');
  list.innerHTML='<div class="post-loading">正在加载文章…</div>';
  return fetch(assetUrl('articles/index.json'))
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(manifest){
      /* 顺序以 index.json 为准（想调文章顺序，改清单即可） */
      var items = (manifest.posts || []);
      if(!items.length){ list.innerHTML='<div class="post-empty">还没有文章，去 articles/ 目录添加吧。</div>'; return; }
      /* 逐篇拉取正文 */
      var seq = Promise.resolve();
      var loaded = [];
      items.forEach(function(meta){
        seq = seq.then(function(){
          return fetch(assetUrl('articles/'+meta.file))
            .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
            .then(function(p){
              p.id = p.id || meta.id;
              loaded.push(p);
            })
            .catch(function(e){
              console.warn('加载文章失败：'+meta.file, e);
              loaded.push({ id:meta.id, title:meta.file, date:'', tags:['加载失败'],
                excerpt:'这篇文章没能加载出来（'+e.message+'）。', content:'' });
            });
        });
      });
      return seq.then(function(){
        posts = loaded;
        renderPosts();
      });
    })
    .catch(function(e){
      /* 文章加载失败（部署损坏 / 服务异常等）：展示 404 页面而不是行内报错 */
      console.error('文章加载失败，已展示 404 页面', e);
      posts = [];
      open404();
    });
}
</script>
